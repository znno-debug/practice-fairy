<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  html,body{margin:0;width:800px;height:400px;overflow:hidden}
  body{font-family:Pretendard,system-ui,sans-serif;background:linear-gradient(135deg,#fff1f2 0%,#ffffff 45%,#eef2ff 100%);display:flex;align-items:center;justify-content:center}
  .wrap{display:flex;align-items:center;gap:44px;padding:0 64px}
  img{width:200px;height:200px;border-radius:44px;box-shadow:0 18px 40px rgba(124,58,237,.25)}
  .badge{display:inline-block;padding:6px 14px;border-radius:999px;background:#ffe4e6;color:#be123c;font-weight:800;font-size:20px}
  h1{margin:14px 0 10px;font-size:52px;font-weight:900;color:#0f172a;letter-spacing:-1.5px}
  p{margin:0;font-size:24px;font-weight:600;color:#475569;line-height:1.5}
</style></head>
<body><div class="wrap">
  <img src="../../icons/icon-512.png" alt="">
  <div>
    <span class="badge">1:1 레슨 리포트</span>
    <h1>연습요정</h1>
    <p>오늘 레슨 내용과<br>선생님 코칭을 확인하세요</p>
  </div>
</div></body></html>
